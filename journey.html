<style>
/* Layout: one calm column, a path of six stations on top, each station one screen. Paper-and-ink world of the 念流．心境 deck. */
:root {
  --paper: #FAF6EC;
  --paper-2: #F1EBDC;
  --ink: #2B2A2E;
  --ink-soft: #6A6560;
  --line: #DDD4C2;
  --spade: #6B5236;
  --heart: #B4566A;
  --diamond: #2F5F8A;
  --club: #3C7A55;
  --core: #9C7A2E;
  --alert: #A33A2A;
  --alert-bg: #F8E3DE;
  --suit: var(--core);
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-latin: "Cormorant Garamond", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17262A; --paper-2: #1F3337; --ink: #E6EDEA; --ink-soft: #8FA3A0; --line: #2C464B;
    --spade: #C9A57E; --heart: #E494A6; --diamond: #8DB6DE; --club: #8CC4A0; --core: #D9B867;
    --alert: #F0A090; --alert-bg: #3A2522; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17262A; --paper-2: #1F3337; --ink: #E6EDEA; --ink-soft: #8FA3A0; --line: #2C464B;
  --spade: #C9A57E; --heart: #E494A6; --diamond: #8DB6DE; --club: #8CC4A0; --core: #D9B867;
  --alert: #F0A090; --alert-bg: #3A2522; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px; }
.brand { display: grid; line-height: 1.2; }
.brand b { font-family: var(--font-display); font-size: 22px; letter-spacing: .12em; }
.brand span { font-family: var(--font-latin); font-style: italic; color: var(--ink-soft); font-size: 15px; letter-spacing: .08em; }
.help { border: 1px solid var(--alert); color: var(--alert); background: transparent; border-radius: 999px; padding: 6px 14px; font: 500 14px var(--font-body); cursor: pointer; }
.help:hover { background: var(--alert-bg); }

/* station path */
.path { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; position: relative; }
.path::before { content: ""; position: absolute; left: 8%; right: 8%; top: 14px; border-top: 1px dashed var(--line); }
.st { display: grid; justify-items: center; gap: 2px; position: relative; font-size: 12px; color: var(--ink-soft); }
.st i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-size: 14px; background: var(--paper); border: 1px solid var(--line); }
.st.done i { background: var(--paper-2); color: var(--ink); }
.st.now i { background: var(--suit); border-color: var(--suit); color: var(--paper); }
.st.now { color: var(--ink); font-weight: 500; }

main#app { display: grid; gap: 20px; }
h1, h2 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.35; }
h1 { font-size: 28px; letter-spacing: .04em; }
h2 { font-size: 22px; letter-spacing: .03em; }
p { margin: 0; }
.lead { color: var(--ink-soft); }
.eyebrow { font-family: var(--font-latin); font-style: italic; color: var(--suit); font-size: 16px; letter-spacing: .1em; }
.block { display: grid; gap: 10px; }
.label { font-weight: 500; font-size: 15px; }
.hint { font-size: 13px; color: var(--ink-soft); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: 15px var(--font-body); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--suit); background: var(--suit); color: var(--paper); }
.weather { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.wx { display: grid; justify-items: center; gap: 4px; padding: 12px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); cursor: pointer; font: 15px var(--font-body); }
.wx svg { width: 40px; height: 32px; stroke: var(--ink-soft); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.wx[aria-pressed="true"] { border-color: var(--suit); box-shadow: inset 0 0 0 1px var(--suit); }
.wx[aria-pressed="true"] svg { stroke: var(--suit); }

.scale { display: grid; gap: 6px; }
.scale-row { display: flex; align-items: center; gap: 12px; }
.scale input[type=range] { flex: 1; accent-color: var(--suit); min-width: 0; }
.scale output { font-family: var(--font-latin); font-size: 30px; width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; color: var(--suit); }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); }
textarea { width: 100%; min-height: 72px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: 15px var(--font-body); background: var(--paper); color: var(--ink); resize: vertical; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 999px; padding: 11px 22px; font: 500 16px var(--font-body); background: var(--suit); color: var(--paper); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.quiet { background: transparent; color: var(--ink-soft); padding: 11px 8px; text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--suit); outline-offset: 2px; }

/* cards */
.draw { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; perspective: 900px; }
.card { aspect-ratio: 631 / 880; max-width: 100%; border: 0; padding: 0; background: none; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.7,.2,1), opacity .4s; }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 10px; backface-visibility: hidden; box-shadow: 0 6px 18px -10px rgba(0,0,0,.45); }
.card .front { transform: rotateY(180deg); }
.card.flip { transform: rotateY(180deg); }
.card.fade { opacity: .25; pointer-events: none; }
.card:hover:not(.flip) { transform: translateY(-4px); }
.reveal { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 16px; align-items: start; }
.reveal img { width: 100%; border-radius: 10px; box-shadow: 0 8px 22px -12px rgba(0,0,0,.5); }
.affirm { font-family: var(--font-display); font-size: 19px; line-height: 1.6; }
.tag { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--suit); border: 1px solid var(--suit); border-radius: 999px; padding: 2px 10px; width: fit-content; }

/* practice options */
.paths { display: grid; gap: 10px; }
.opt { text-align: left; display: grid; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); cursor: pointer; font: 15px var(--font-body); }
.opt b { font-family: var(--font-display); font-size: 18px; }
.opt .meta { font-size: 13px; color: var(--ink-soft); }
.opt[aria-pressed="true"] { border-color: var(--suit); box-shadow: inset 3px 0 0 var(--suit); }

/* practice */
.ring-wrap { display: grid; place-items: center; padding: 8px 0; }
.ring { width: min(220px, 60vw); aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid var(--suit); display: grid; place-items: center; position: relative; }
.ring::before { content: ""; position: absolute; inset: 14%; border-radius: 50%; background: var(--suit); opacity: .12; animation: tide 10s ease-in-out infinite; }
.ring .time { font-family: var(--font-latin); font-size: 40px; font-variant-numeric: tabular-nums; position: relative; }
@keyframes tide { 0%,100% { transform: scale(.82); } 50% { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .ring::before { animation: none; } .card { transition: none; } }
.guide { font-family: var(--font-display); font-size: 20px; line-height: 1.7; min-height: 4.2em; text-align: center; text-wrap: balance; }
.progress { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--suit); width: 0; transition: width 1s linear; }

/* garden */
.garden { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; background: var(--paper-2); }
.garden svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-soft); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 5px; }
.note { border-left: 3px solid var(--suit); padding: 4px 0 4px 12px; }

/* safety */
.safe { border: 1px solid var(--alert); background: var(--alert-bg); border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
.safe h2 { color: var(--alert); }
.lines { display: grid; gap: 6px; }
.line { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; align-items: baseline; }
.line b { font-family: var(--font-latin); font-size: 24px; user-select: all; font-variant-numeric: tabular-nums; }
.proto { font-size: 12px; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 12px; }
dialog { border: 0; border-radius: 18px; padding: 0; max-width: min(480px, calc(100vw - 32px)); background: var(--paper); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog .safe { border-radius: 18px; }
@media (max-width: 420px) { h1 { font-size: 24px; } .reveal { grid-template-columns: minmax(0, 110px) minmax(0, 1fr); } }
</style>

<div class="wrap">

  const c = `var(--${p.suit})`;

  if (k === "flower") g = `<path d="M0 0V-18" stroke="var(--club)" stroke-width="2"/><g transform="translate(0,-24)">${[0, 72, 144, 216, 288].map((a) => `<ellipse rx="4.5" ry="8" transform="rotate(${a}) translate(0,-7)" fill="${c}" opacity=".85"/>`).join("")}<circle r="3.5" fill="var(--core)"/></g>`;
  if (k === "crystal") g = `<path d="M0 -32 L9 -14 L0 0 L-9 -14 Z" fill="${c}" opacity=".85"/><path d="M0 -32 L0 0" stroke="var(--paper)" stroke-width="1" opacity=".6"/>`;
  if (k === "sprout") g = `<path d="M0 0V-20" stroke="${c}" stroke-width="2.2"/><path d="M0 -12C-12 -14-14 -24-14 -26C-4 -26 0 -20 0 -14" fill="${c}"/><path d="M0 -18C10 -20 13 -30 13 -32C3 -32 0 -26 0 -20" fill="${c}" opacity=".8"/>`;
  if (k === "star") g = `<path d="M0 -30 L4 -18 L16 -16 L6 -9 L9 3 L0 -4 L-9 3 L-6 -9 L-16 -16 L-4 -18 Z" fill="${c}" opacity=".85"/>`;
  return `<g transform="translate(${x},${y})" opacity="${o}">${g}</g>`;
}
function gardenHTML() {

  const W = 520, perRow = 8, H = Math.max(1, Math.ceil(items.length / perRow)) * 56 + 14;

/* ---------- 規則 ---------- */
function fitMins(pr, want, cap) {
  const ok = PRACTICE[pr].times.filter((t) => t <= Math.min(want, cap));
  return ok.length ? Math.max(...ok) : null;
}
function recommend() {
  const sit = SITU.find((s) => s.id === S.situ);
  const prefs = store.get("mf-prefs", {});
  const cap = S.before >= 7 ? 3 : 10;           // 規範 7：≥7 只給 1–3 分鐘
  let list = [...sit.rec];
  const why = {};
  if (prefs.avoidBreath) list = list.map((id) => (id === "M01" ? ((why.M03 = "上次注意呼吸不舒服，換成聲音"), "M03") : id)); // R04
  if (S.before >= 7) list = list.map((id) => (["M04", "M03", "A02", "M01"].includes(id) ? ((why.M02 = "風浪較大，先從睜眼接地開始"), "M02") : id));
  const out = [];
  for (let id of list) {
    let m = fitMins(id, S.time, cap);
    if (m == null) { why.M02 = why.M02 || "配合你的時間"; id = "M02"; m = fitMins("M02", S.time, cap) || 1; }
    if (!out.find((o) => o.id === id)) out.push({ id, mins: m, why: why[id] });
  }
  if (out.length < 2) { const alt = out[0].id === "A01" ? "M06" : "A01"; out.push({ id: alt, mins: fitMins(alt, S.time, cap) || 1 }); }
  return out.slice(0, 2);
}
function scan(t) {
  if (CRISIS.some((k) => t.includes(k))) return "crisis";
  if (UNSURE.some((k) => t.includes(k))) return "check";
  if (DISSOC.some((k) => t.includes(k))) return "ground";
  return null;
}
function evaluate() {
  const prefs = store.get("mf-prefs", { helpful: {}, worse: 0 });
  prefs.helpful = prefs.helpful || {};
  let title = "這一次，你停下來了", body = "", next = "";
  const dW = S.after - S.before, dC = S.clarityAfter - S.clarityBefore;
  if (S.feel === "更不舒服") {
    prefs.worse = (prefs.worse || 0) + 1;
    title = "謝謝你誠實地說";
    body = "練習讓你更不舒服時，停下來或換一個方式都是對的。";
    next = prefs.worse >= 2 ? "這是連續第二次覺得更不舒服。建議找課程老師聊聊，一起看看適合你的練習。" : "下一次，我們換一個注意的焦點。";
  } else {
    prefs.worse = 0;
    if (dW >= 0 && dC > 0) body = "風浪沒有變小，但你看得更清楚了。看清楚此刻的天氣，就是一次完整的練習。";   // R07
    else if (dW < 0) body = `風浪從 ${S.before} 變成 ${S.after}。除了分數，也記得你在練習中注意到的事。`;
    else body = "天氣沒什麼變化，也沒關係。練習不是為了把情緒消掉，而是看見它。";
    if (S.feel === "有幫助") {
      prefs.helpful[S.practice] = (prefs.helpful[S.practice] || 0) + 1;
      if (prefs.helpful[S.practice] >= 2) next = `「${PRACTICE[S.practice].name}」已經兩次對你有幫助，下次可以繼續用它。`;   // R06
    }
  }
  if (S.diff.includes("注意呼吸不舒服")) { prefs.avoidBreath = true; next = next || "之後不會預設用呼吸當錨點，會先給你腳底、聲音或視覺。"; }  // R04
  if (S.diff.includes("不喜歡閉眼")) prefs.eyesOpen = true;   // R05
  if (S.diff.includes("太長") && !next) next = "下次同一個練習，我們縮短時間。";   // R03
  store.set("mf-prefs", prefs);
  const g = store.get("mf-garden", []);
  g.push({ suit: card(S.picked).suit, d: new Date().toISOString().slice(0, 10), pr: S.practice, b: S.before, a: S.after, cb: S.clarityBefore, ca: S.clarityAfter, f: S.feel });
  store.set("mf-garden", g);
  S.result = { title, body, next };
}

  render();
  if (EMBED) { try { window.frameElement && window.frameElement.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {} }
  else window.scrollTo({ top: 0, behavior: "smooth" });
}
function render() {
  if (S.screen === "home" && store.get("mf-prefs", {}).eyesOpen) S.eyes = "open";
  $("#app").innerHTML = V[S.screen]();
  renderPath();
  bind();
  if (S.screen === "practice") startTimer();
}
function stopTimer() { if (timer) { clearInterval(timer.id); timer = null; } }
function startTimer() {
  const pr = PRACTICE[S.practice];
  const total = S.mins * 60;
  timer = { left: total, paused: false, id: null };
  const tick = () => {
    if (timer.paused) return;
    timer.left = Math.max(0, timer.left - 1);
    const done = total - timer.left;
    const idx = Math.min(pr.steps.length - 1, Math.floor((done / total) * pr.steps.length));
    const g = $("#guide"); if (g && g.textContent !== pr.steps[idx]) g.textContent = pr.steps[idx];
    const c = $("#clock"); if (c) c.textContent = `${Math.floor(timer.left / 60)}:${pad(timer.left % 60)}`;
    const b = $("#bar"); if (b) b.style.width = `${(done / total) * 100}%`;
    if (timer.left === 0) { stopTimer(); go("reflect"); }
  };
  timer.id = setInterval(tick, 1000);
}
function bind() {
  document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll("[data-wx]").forEach((b) => b.onclick = () => {
    S.weather = b.dataset.wx; S.before = WEATHER.find((w) => w.id === S.weather).v; render(); });
  const sl = (id, key, out) => { const el = $("#" + id); if (el) el.oninput = () => { S[key] = +el.value; $("#" + out).textContent = el.value; }; };
  sl("before", "before", "beforeOut"); sl("clarity", "clarityBefore", "clarityOut");
  sl("after", "after", "afterOut"); sl("clarity2", "clarityAfter", "clarity2Out");
  document.querySelectorAll("[data-situ]").forEach((b) => b.onclick = () => { S.note = $("#note").value; S.situ = b.dataset.situ; render(); });
  document.querySelectorAll("[data-time]").forEach((b) => b.onclick = () => { S.note = $("#note").value; S.time = +b.dataset.time; render(); });
  document.querySelectorAll("[data-eyes]").forEach((b) => b.onclick = () => { S.note = $("#note").value; S.eyes = b.dataset.eyes; render(); });
  const toDraw = $("#toDraw");
  if (toDraw) toDraw.onclick = () => {
    S.note = $("#note").value;
    const route = scan(S.note);
    S.note = "";   // 不保存使用者文字
    if (route) return go(route);
    if (S.before >= 8) return go("ground");     // 規範 9：B 類
    const pool = [...SITU.find((s) => s.id === S.situ).pool].sort(() => Math.random() - 0.5).slice(0, 3);
    S.pool = pool; S.picked = null; go("draw");
  };
  document.querySelectorAll("[data-card]").forEach((b) => b.onclick = () => {
    const no = +b.dataset.card;
    b.classList.add("flip");
    document.querySelectorAll("[data-card]").forEach((o) => { if (o !== b) o.classList.add("fade"); });
    setSuit(card(no).suit);
    setTimeout(() => { S.picked = no; render(); }, 900);
  });
  document.querySelectorAll("[data-pr]").forEach((b) => b.onclick = () => { S.practice = b.dataset.pr; S.mins = +b.dataset.min; render(); });
  const sp = $("#startPr"); if (sp) sp.onclick = () => go("practice");
  const pa = $("#pause"); if (pa) pa.onclick = () => { timer.paused = !timer.paused; pa.textContent = timer.paused ? "繼續" : "暫停"; };
  const st = $("#stopPr"); if (st) st.onclick = () => { stopTimer(); go("reflect"); };
  const sk = $("#skip"); if (sk) sk.onclick = () => { stopTimer(); go("reflect"); };
  document.querySelectorAll("[data-feel]").forEach((b) => b.onclick = () => { keepSliders(); S.feel = b.dataset.feel; render(); });
  document.querySelectorAll("[data-diff]").forEach((b) => b.onclick = () => {
    keepSliders(); const d = b.dataset.diff; S.diff = S.diff.includes(d) ? S.diff.filter((x) => x !== d) : [...S.diff, d]; render(); });
  const hv = $("#harvest"); if (hv) hv.onclick = () => {
    keepSliders();
    const ans = $("#answer").value;
    if (scan(ans) === "crisis") return go("crisis");
    if (scan(ans) === "check") return go("check");
    evaluate(); go("harvest");
  };
  const ag = $("#again"); if (ag) ag.onclick = () => { S = fresh(); go("weather"); };
  const sy = $("#safeYes"); if (sy) sy.onclick = () => { S.situ = S.situ || "S00"; S.pool = [1]; S.picked = 1; S.practice = "M02"; S.mins = 1; setSuit("spade"); go("practice"); };
  const sn = $("#safeNo"); if (sn) sn.onclick = () => go("crisis");
  const ot = $("#okTired"); if (ot) ot.onclick = () => go("ground");
  const no = $("#notOk"); if (no) no.onclick = () => go("crisis");
}
function keepSliders() {
  const a = $("#after"), c = $("#clarity2");
  if (a) S.after = +a.value; if (c) S.clarityAfter = +c.value;
}

$("#helpLines").innerHTML = linesHTML();
$("#helpBtn").onclick = () => { const d = $("#helpDlg"); d.showModal ? d.showModal() : d.setAttribute("open", ""); };
$("#helpClose").onclick = () => { const d = $("#helpDlg"); d.close ? d.close() : d.removeAttribute("open"); };

function start(data) {
  if (data && data.S) { S = { ...fresh(), ...data.S }; if (S.screen === "practice") S.screen = "choose"; }
  if (S.picked) setSuit(card(S.picked).suit);
  render();
}
// 嵌入時讓 iframe 高度跟著內容走（同源 iframe 才能調整，失敗時維持 Streamlit 給的高度並可捲動）
if (EMBED) {
  const fit = () => { try { const f = window.frameElement; if (f) f.style.height = Math.max(640, document.documentElement.scrollHeight + 8) + "px"; } catch (e) {} };
  try { new ResizeObserver(fit).observe(document.body); } catch (e) {}
  window.addEventListener("load", fit);
  fit();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
